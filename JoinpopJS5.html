<!DOCTYPE html>
<html>
    <body>
        <h2>JavaScript Array Methods</h2>
        <h2>Join() and pop()</h2>
        <p>the join() method joins array elements into a string and the pop() method removes the last element from an array.</p>
        <p id="Join"></p>
        <p id="Pop"></p>
        <p id="Pop2"></p>
        <script>
            var fruits = ["banana", "mango", "apple", "Lychee"];
            document.getElementById("Join").innerHTML = fruits.join(" * ")
            document.getElementById("Pop").innerHTMl = fruits;
            fruits.pop();
            document.getElementById("Pop2").innerHTML = fruits;
        </script>
    </body>
</html>
