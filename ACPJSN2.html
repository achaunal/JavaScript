<!DOCTYPE html>
<html>
    <head>
        <title>
            Var times Var
        </title>
    </head>
    <body>
        <h1>
            Multiplication
        </h1>
        <button type="button" onclick="multiply()">Multiply</button>
      <p id="demo"></p>
      <script>
            var b = 5;
           
            var a = 2;
function multiply(){
document.getElementById("demo").innerHTML= b*a
}
        </script>
    </body>
</html>
